apiVersion: runtime.cluster.x-k8s.io/v1alpha1
kind: ExtensionConfig
metadata:
  name: inplace-update
  annotations:
    runtime.cluster.x-k8s.io/inject-ca-from-secret: PLACEHOLDER/PLACEHOLDER
spec:
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      port: 9444
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
